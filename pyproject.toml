[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "repoverity"
dynamic = ["version"]
description = "Evidence-based code trust audit for Python repositories"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "RepoVerity contributors" }
]
keywords = ["static-analysis", "code-quality", "ci", "sarif", "python", "code-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aprashnasuraj-dev/AI-Code-Quality-Trust-Layers"
Repository = "https://github.com/aprashnasuraj-dev/AI-Code-Quality-Trust-Layers"
Issues = "https://github.com/aprashnasuraj-dev/AI-Code-Quality-Trust-Layers/issues"

[project.scripts]
repoverity = "repoverity.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=2.0,<3",
  "pytest>=9,<10",
  "pyyaml>=6,<7",
  "ruff>=0.16,<1",
  "twine>=7,<8",
]

[tool.setuptools.dynamic]
version = { attr = "repoverity._version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/intentionally_bad"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/repoverity"]

[tool.repoverity]
exclude = ["tests/fixtures/**", "examples/intentionally_bad/**"]
fail-on = "none"

[tool.repoverity.rules]
COM402 = "info"

name: Format release candidate

on:
  push:
    branches:
      - release-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply Ruff lint fixes
        run: python -m ruff check . --fix
      - name: Apply Ruff formatting
        run: python -m ruff format .
      - name: Verify Ruff lint
        run: python -m ruff check .
      - name: Verify Ruff format
        run: python -m ruff format --check .
      - name: Run tests
        run: python -m pytest
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Commit mechanical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes were produced.'
            exit 1
          fi
          git commit -m 'Apply Ruff formatting'
          git push origin HEAD:release-format

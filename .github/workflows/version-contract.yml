name: Add release version flag

on:
  push:
    branches:
      - release-version

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply version contract fix
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path('src/repoverity/cli.py')
          text = cli.read_text(encoding='utf-8')
          needle = '    subparsers = parser.add_subparsers(dest="command", required=True)\n'
          replacement = (
              '    parser.add_argument(\n'
              '        "--version",\n'
              '        action="version",\n'
              '        version=f"RepoVerity {__version__}",\n'
              '    )\n'
              + needle
          )
          if text.count(needle) != 1:
              raise SystemExit('unexpected CLI parser shape')
          cli.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          tests = Path('tests/integration/test_cli.py')
          text = tests.read_text(encoding='utf-8')
          needle = (
              'def test_version() -> None:\n'
              '    result = run_cli("version")\n'
              '    assert result.returncode == 0 and "RepoVerity 0.1.0" in result.stdout\n\n\n'
          )
          replacement = needle + (
              'def test_global_version_flag() -> None:\n'
              '    result = run_cli("--version")\n'
              '    assert result.returncode == 0 and result.stdout.strip() == "RepoVerity 0.1.0"\n\n\n'
          )
          if text.count(needle) != 1:
              raise SystemExit('unexpected CLI test shape')
          tests.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          workflow = Path('.github/workflows/release-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          wheel = '          /tmp/repoverity-wheel-smoke/bin/repoverity version\n          /tmp/repoverity-wheel-smoke/bin/repoverity --help >/dev/null\n'
          wheel_new = '          /tmp/repoverity-wheel-smoke/bin/repoverity version\n          /tmp/repoverity-wheel-smoke/bin/repoverity --version\n          /tmp/repoverity-wheel-smoke/bin/repoverity --help >/dev/null\n'
          sdist = '          /tmp/repoverity-sdist-smoke/bin/repoverity version\n          /tmp/repoverity-sdist-smoke/bin/repoverity --help >/dev/null\n'
          sdist_new = '          /tmp/repoverity-sdist-smoke/bin/repoverity version\n          /tmp/repoverity-sdist-smoke/bin/repoverity --version\n          /tmp/repoverity-sdist-smoke/bin/repoverity --help >/dev/null\n'
          if text.count(wheel) != 1 or text.count(sdist) != 1:
              raise SystemExit('unexpected release-validation workflow shape')
          workflow.write_text(text.replace(wheel, wheel_new, 1).replace(sdist, sdist_new, 1), encoding='utf-8')
          PY
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check . --fix
      - name: Ruff format
        run: python -m ruff format .
      - name: Ruff lint check
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src/repoverity
      - name: Tests
        run: python -m pytest
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Verify global version flag
        run: PYTHONPATH=src python -m repoverity --version
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/repoverity/cli.py tests/integration/test_cli.py .github/workflows/release-validation.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Support global --version flag'
          git push origin HEAD:release-version

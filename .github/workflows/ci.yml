name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src/repoverity
      - name: Tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install wheel without dependencies
        run: |
          python -m venv /tmp/repoverity-wheel-smoke
          /tmp/repoverity-wheel-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/repoverity-wheel-smoke/bin/repoverity version
          /tmp/repoverity-wheel-smoke/bin/repoverity audit examples/intentionally_good --fail-on high --no-color

  supported-python:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest pyyaml
      - run: PYTHONPATH=src python -m pytest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest
        env:
          PYTHONPATH: src

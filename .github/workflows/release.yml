name: Release

on:
  push:
    branches: [publish-v0.1.0]

permissions:
  contents: read

jobs:
  publish-v0-1-0:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      TARGET_SHA: ee79dad8bb6586fbe92de26fd22e9f440ed863f0
      TAG_NAME: v0.1.0
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ee79dad8bb6586fbe92de26fd22e9f440ed863f0
          fetch-depth: 0
      - name: Verify publication target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$TARGET_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; refusing duplicate publication."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install release toolchain
        run: python -m pip install -e '.[dev]'
      - name: Re-run release gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/repoverity
          python -m pytest
          python -m compileall -q src tests
          python -m repoverity audit . --format json --output /tmp/self-audit.json --no-color
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/self-audit.json').read_text(encoding='utf-8'))
          summary = payload['summary']
          if summary['total_findings'] != 0 or summary['analysis_issues'] != 0:
              raise SystemExit(f"self-audit not clean: {summary}")
          PY
      - name: Build and check distributions
        run: |
          rm -rf build dist ./*.egg-info src/*.egg-info
          python -m build
          python -m twine check dist/*
          sha256sum dist/* | tee SHA256SUMS
      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/repoverity-publish-smoke
          /tmp/repoverity-publish-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/repoverity-publish-smoke/bin/repoverity --version
          /tmp/repoverity-publish-smoke/bin/repoverity --help >/dev/null
          /tmp/repoverity-publish-smoke/bin/repoverity audit "$GITHUB_WORKSPACE/examples/intentionally_good" --fail-on high --no-color
      - name: Upload publication artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repoverity-v0.1.0-publication
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: Create immutable release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "RepoVerity $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"
      - name: Create curated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            dist/* \
            SHA256SUMS \
            --target "$TARGET_SHA" \
            --title "RepoVerity $TAG_NAME — Evidence you can review" \
            --notes-file docs/RELEASE_NOTES_v0.1.0.md

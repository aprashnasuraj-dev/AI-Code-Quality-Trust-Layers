name: False positive
description: Report a finding that has a legitimate counterexample
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: ABS201
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Reduced code example
      render: python
    validations:
      required: true
  - type: textarea
    id: exception
    attributes:
      label: Why the pattern is legitimate
      description: Explain the contract, framework requirement, compatibility boundary, or other counterexample.
    validations:
      required: true
